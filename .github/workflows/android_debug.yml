name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init M3UFLIX com.mooncrown.m3uflix --web-dir dist
          npx cap add android
          npx cap copy android

      # TV BOX VE CORS İÇİN KRİTİK AYARLAR
      - name: Android TV & Network Fix
        run: |
          # 1. Network Security Config (HTTP ve Güvenli Olmayan Linkler İçin)
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml
          
          # 2. AndroidManifest Güncelleme (Config'i tanıtma ve donanım gereksinimlerini esnetme)
          # Uygulamanın TV Box'larda görünebilmesi için dokunmatik ekran zorunluluğunu kaldırıyoruz
          sed -i '/<application/i \    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Force Fix Kotlin Duplicates
        run: |
          sed -i '1i\configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7" } }' android/app/build.gradle

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3uflix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
