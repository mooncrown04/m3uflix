name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor
        run: |
          # APK içinde CORS sorunlarını kökten çözmek için Native HTTP eklentisini ekliyoruz
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/http --legacy-peer-deps
          npx cap init M3UFLIX com.mooncrown.m3uflix --web-dir dist || true
          npx cap add android || true
          
          # --- KRİTİK ADIM: HTTP YAYINLARINA İZİN VER ---
          # Android 9+ cihazlarda http:// linklerinin (IPTV kanallarının) açılması için şarttır.
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<application/a \    android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          fi
          
          npx cap copy android

      - name: Force Fix Kotlin Duplicates
        run: |
          if [ -d "android" ]; then
            sed -i '1i\configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7" } }' android/app/build.gradle
          fi

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3uflix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
