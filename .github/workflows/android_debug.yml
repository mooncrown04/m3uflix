name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init M3UFLIX com.mooncrown.m3uflix --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          # Çakışan kütüphaneleri komut satırından devre dışı bırakıyoruz
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true \
          -Dorg.gradle.project.kotlin.stdlib.default.dependency=false
