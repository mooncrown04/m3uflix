name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        # Bağımlılık çakışmalarını aşmak için --legacy-peer-deps eklendi
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor
        # Hatayı çözmek için Capacitor paketlerine --legacy-peer-deps eklendi
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init M3UFLIX com.mooncrown.m3uflix --web-dir dist || true
          npx cap add android || true
          npx cap copy android

      # KOTLIN ÇAKIŞMASINI ÇÖZEN ADIM
      - name: Force Fix Kotlin Duplicates
        run: |
          if [ -d "android" ]; then
            sed -i '1i\configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7" } }' android/app/build.gradle
          fi

      # DERLEME VE APK OLUŞTURMA
      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          # Jetifier ve AndroidX desteğiyle derleme
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3uflix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
