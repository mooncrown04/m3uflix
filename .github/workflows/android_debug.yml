name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # İstersen elinle de başlatabilmen için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Hatanın çözümü tam olarak burası
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          npx cap init M3UFLIX com.mooncrown.m3uflix --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3uflix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
