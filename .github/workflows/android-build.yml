name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Cache'i manuel yönetmek veya temizlemek için bu satırı 
          # sorun yaşarsanız kaldırabilirsiniz.
          cache: 'npm'

      - name: Install Dependencies
        # Hata aldığınız 'native binding' sorununu önlemek için 
        # --force ekleyerek temiz bir kurulum yapıyoruz.
        run: npm ci || npm install --force

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, adding platform..."
            npx cap add android
          else
            echo "Android folder exists, syncing assets..."
            npx cap sync android
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          # Gradle'in de temiz bir build almasını sağlamak için clean ekledik
          ./gradlew clean assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-IPTV-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
