name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Cache'i kapattık, native hata almamak için her seferinde temiz kurulum şart
          cache: ''

      - name: Install Dependencies
        run: |
          # Önceki tüm yapılandırmaları ve kilit dosyalarını temizle
          rm -rf node_modules
          rm -f package-lock.json
          
          # Linux ortamı için paketleri zorunlu olarak yeniden kur
          npm install --cpu=x64 --os=linux
          
          # Ek güvenlik: Native modülleri ortam için tekrar derle
          npm rebuild @tailwindcss/oxide

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, adding platform..."
            npx cap add android
          else
            echo "Android folder exists, syncing assets..."
            npx cap sync android
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-IPTV-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
