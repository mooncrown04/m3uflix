name: M3U Güncelle ve APK Oluştur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java ve Android SDK Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Python ve M3U Güncelleme
        run: |
          pip install requests
          python combine_m3u.py
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "M3U Listesi Güncellendi" || echo "Değişiklik yok"
          git push

      - name: Bağımlılıkları Yükle (React 19 Hatası Çözümü)
        run: npm install --legacy-peer-deps

      - name: Web Buildini Yap (Vite/React)
        run: npm run build

      - name: Capacitor Platform Ayarları (Eksik Android Klasörü Çözümü)
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle (İndirme Linki Oluşturur)
        uses: actions/upload-artifact@v4
        with:
          name: uygulama-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
