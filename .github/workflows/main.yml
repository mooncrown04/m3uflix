name: M3U Güncelle ve APK Oluştur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java ve Android SDK Kurulumu (Java 21 Hatası Çözüldü)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Hata veren kısım burasıydı, 21'e yükselttik

      - name: Python ve M3U Güncelleme
        run: |
          pip install requests
          python combine_m3u.py
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "M3U Listesi Güncellendi" || echo "Değişiklik yok"
          git push

      - name: Bağımlılıkları Yükle
        run: npm install --legacy-peer-deps

      - name: Web Buildini Yap
        run: npm run build

      - name: Capacitor Yapılandırma ve Platform Ayarları
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.m3uflix.app", "appName": "M3UFlix", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: uygulama-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
